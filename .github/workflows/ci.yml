name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check . && python -m ruff format --check .
      - name: Test
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python -m pytest
      - name: Sensitive-content check
        run: python scripts/check_sensitive.py
      - name: Pipeline smoke test
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python -m business_review.cli smoke
      - name: Supplied-input and approval smoke test
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          python -m business_review.cli run --input-weekly-kpis examples/weekly_kpis.csv --output-root /tmp/business-review-input
          python -m business_review.cli apply-decisions --claims /tmp/business-review-input/reports/claims.csv --decisions examples/review_decisions.csv --output /tmp/business-review-input/reports/reviewed_claims.csv
